name: Frontend research dashboard checks

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/research-dashboard.test.cjs"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/research-dashboard.test.cjs"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  node22:
    name: Frontend scripts and research metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline frontend syntax and statistical tests
        run: node --test tests/research-dashboard.test.cjs
