name: Offline Firebase CLI status parameter resolution

on:
  pull_request:
    paths:
      - "functions/status-cli-parameter-probe.test.js"
      - ".github/workflows/offline-status-cli-parameter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Pinned Firebase CLI resolver, synthetic input only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned public libraries only (no lifecycle scripts)
        run: npm install --prefix functions --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-tools@15.28.2 firebase-functions@6.4.0 firebase-admin@13.4.0
      - name: Execute local CLI resolver library tests without credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
          GOOGLE_CLOUD_PROJECT: ""
          GOOGLE_CLOUD_QUOTA_PROJECT: ""
          GCLOUD_PROJECT: ""
          CLOUDSDK_CORE_PROJECT: ""
          FIREBASE_CONFIG: ""
          FIREBASE_TOKEN: ""
          ODDS_BACKEND_STATUS_SERVICE_ACCOUNT: ""
        run: node --test functions/status-cli-parameter-probe.test.js
      - name: Assert no project files or Firebase env generated
        shell: bash
        run: |
          git diff --exit-code
          test ! -e functions/.env
          if compgen -G "functions/.env.*" > /dev/null; then
            echo "Unexpected Firebase environment file"
            exit 1
          fi
