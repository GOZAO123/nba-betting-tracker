name: Offline Firebase target and deletion plan safety

on:
  pull_request:
    paths:
      - "functions/status-target-deletion-plan.test.js"
      - ".github/workflows/offline-status-target-deletion-plan.yml"
      - "docs/update-35-1d15-22-offline-target-deletion-plan.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Real Firebase CLI v15.28.2 planner (synthetic, disconnected)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned public Firebase libraries without lifecycle scripts
        run: npm install --prefix functions --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-tools@15.28.2 firebase-functions@6.4.0 firebase-admin@13.4.0
      - name: Run isolated CLI SDK and deployment planner checks (never invoke firebase command)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
          GOOGLE_CLOUD_PROJECT: ""
          GOOGLE_CLOUD_QUOTA_PROJECT: ""
          GCLOUD_PROJECT: ""
          CLOUDSDK_CORE_PROJECT: ""
          FIREBASE_CONFIG: ""
          FIREBASE_TOKEN: ""
          ODDS_BACKEND_STATUS_SERVICE_ACCOUNT: ""
        run: |
          node --check functions/status-target-deletion-plan.test.js
          node --test functions/status-sdk-manifest-probe.test.js functions/status-cli-parameter-probe.test.js functions/status-wire-discovery.test.js functions/status-target-deletion-plan.test.js
      - name: Reject any Firebase environment artifact or tracked edit
        shell: bash
        run: |
          git diff --exit-code
          test ! -e functions/.env
          if compgen -G "functions/.env.*" > /dev/null; then
            echo "Unexpected Firebase environment file"
            exit 1
          fi
