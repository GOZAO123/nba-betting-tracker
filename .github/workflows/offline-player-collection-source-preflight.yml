name: D15.38 offline player collection source safety

on:
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/offline-player-collection-source-preflight.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/offline-player-collection-source-preflight.yml"

permissions:
  contents: read

jobs:
  source-safety:
    name: Node 22 player collection source-only release hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax only - no cloud tools
        run: |
          node --check functions/offline-player-collection-source-preflight.js
          node --check functions/offline-player-collection-source-preflight.test.js
      - name: Check source-only drift and original custody regressions
        run: |
          node --test functions/offline-player-collection-source-preflight.test.js functions/offline-quote-collection-preflight.test.js functions/offline-player-receipt-link.test.js functions/offer-player-crosswalk.test.js
