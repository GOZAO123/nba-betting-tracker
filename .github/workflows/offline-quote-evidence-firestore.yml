name: D15.31 offline Admin quote evidence transaction

on:
  pull_request:
    paths:
      - "functions/offline-quote-evidence-firestore.js"
      - "functions/offline-quote-evidence-firestore.test.js"
      - ".github/workflows/offline-quote-evidence-firestore.yml"
  push:
    branches: [main]
    paths:
      - "functions/offline-quote-evidence-firestore.js"
      - "functions/offline-quote-evidence-firestore.test.js"
      - ".github/workflows/offline-quote-evidence-firestore.yml"

permissions:
  contents: read

jobs:
  quote-admin-adapter:
    name: Node 22 offline quote Admin transaction verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks without external API calls
        run: |
          node --check functions/offline-quote-evidence-firestore.js
          node --check functions/offline-quote-evidence-firestore.test.js
      - name: Synthetic Admin create-only and replay tests
        run: node --test functions/offline-quote-evidence-firestore.test.js
