name: D15.35 offline persistent diagnostic summary

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/odds-diagnostic-history.test.cjs"
      - ".github/workflows/offline-odds-diagnostic-history.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/odds-diagnostic-history.test.cjs"
      - ".github/workflows/offline-odds-diagnostic-history.yml"

permissions:
  contents: read

jobs:
  local-diagnostic-summary:
    name: Node 22 local diagnostic summary and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline syntax
        run: node --check tests/odds-diagnostic-history.test.cjs
      - name: Restart, local storage, privacy and call boundary regression
        run: node --test tests/odds-diagnostic-history.test.cjs
